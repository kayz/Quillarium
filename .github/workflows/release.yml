name: Desktop Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            target: win
            artifact_name: quillarium-windows
            artifact_path: apps/desktop/release/*.exe
          - label: macOS
            os: macos-latest
            target: mac
            artifact_name: quillarium-macos
            artifact_path: apps/desktop/release/*.dmg
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify release tag matches desktop version
        shell: bash
        run: >-
          node -e "const pkg=require('./apps/desktop/package.json');
          const expected='v'+pkg.version;
          if(process.env.GITHUB_REF_NAME!==expected){
          console.error('Expected tag '+expected+', received '+process.env.GITHUB_REF_NAME);
          process.exit(1)}"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Package desktop application
        run: pnpm --filter @quillarium/desktop package:${{ matrix.target }}
      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: quillarium-*
          path: release
          merge-multiple: true
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find release -maxdepth 1 -type f -print)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No packaged artifacts were downloaded." >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "Quillarium $GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY"
          fi
