appId: com.quillarium.desktop
productName: Quillarium
asar: true

directories:
  output: release

files:
  - dist/main/**/*.js
  - '!dist/main/**/*.test.js'
  - dist/renderer/**/*
  - electron/preload.cjs
  - assets/brand/quillarium-app-icon.png
  - package.json
  - '!node_modules/@quillarium/*/src/**/*'
  - '!node_modules/@quillarium/*/dist/**/*.test.*'
  - '!node_modules/@quillarium/*/dist/fixtures/**/*'
  - '!node_modules/@quillarium/*/dist/**/*.d.ts'
  - '!node_modules/@quillarium/*/dist/**/*.d.ts.map'
  - '!node_modules/@quillarium/*/dist/**/*.js.map'
  - '!node_modules/@quillarium/*/README.md'
  - '!node_modules/@quillarium/*/tsconfig*.json'
  - '!node_modules/@quillarium/*/tsconfig.tsbuildinfo'

win:
  icon: assets/brand/quillarium-app-icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  artifactName: '${productName}-${version}-windows-${arch}.${ext}'
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  icon: assets/brand/quillarium-app-icon.icns
  identity: null
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - x64
        - arm64

dmg:
  artifactName: '${productName}-${version}-macos-${arch}.${ext}'
