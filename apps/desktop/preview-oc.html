<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>灯下的城 · 琢磨</title>
  </head>
  <body>
    <div class="sample-shell">
      <header class="top-chrome">
        <a class="brand" href="/preview-welcome.html" aria-label="琢磨">
          <span class="brand-wordmark">琢磨</span>
        </a>
        <div class="project-label">灯下的城</div>
        <span class="sample-role">OC</span>
        <div class="top-spacer"></div>
        <button class="status-pill" type="button">设置</button>
      </header>
      <div class="sample-body">
        <nav class="sample-nav" aria-label="模块">
          <button type="button" class="active">世界书</button>
          <button type="button">人物</button>
          <button type="button">正设</button>
          <button type="button">写作</button>
          <button type="button">伏笔</button>
          <button type="button">检查</button>
        </nav>
        <main class="sample-main">
          <div class="sample-cards">
            <div class="sample-card-list" aria-label="世界书条目">
              <button type="button" class="active">
                <strong>城门口</strong>
                <small>地点</small>
              </button>
              <button type="button">
                <strong>灯市</strong>
                <small>地点</small>
              </button>
              <button type="button">
                <strong>旧码头的潮声</strong>
                <small>设定</small>
              </button>
            </div>
            <article class="sample-card">
              <h1>城门口</h1>
              <p>南门只在黄昏开一条缝。守门的人认得灯，不认脸。进来的人把灯留在门槛左边，出去时再取。</p>
              <div class="sample-display">尚未上传</div>
              <button class="secondary" type="button">上传图片</button>
            </article>
          </div>
        </main>
        <aside class="sample-side" aria-label="条目">
          <h2>条目</h2>
          <div class="sample-field">类型<span>地点</span></div>
          <div class="sample-field">别名<span>南门</span></div>
          <div class="sample-field">图片<span>手绘，未上传</span></div>
        </aside>
      </div>
    </div>
    <script type="module">
      import '/src/styles.css'
    </script>
  </body>
