            <h1>第三章 渡口</h1>
            <p>船靠岸时天还没有亮。江面上只剩一盏灯，灯影被水切成两段，一段跟着船，一段留在原地。</p>
            <p>
              他把包袱换到左手，右手按住舱板。木头是湿的，指节上很快沾了一层细沙。岸上有人喊了一声名字，声音不高，像是怕把江面叫醒。
            </p>
            <p>
              他应了。应完才发现自己答应的不是这个名字。那个人已经转身往坡上走，斗笠压得很低，只留出一截发白的衣领。
            </p>
